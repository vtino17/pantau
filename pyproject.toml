[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pantau"
version = "0.2.0"
description = "CLI inspeksi keamanan link & domain. Deteksi phishing dengan pola khas Indonesia."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
pantau = "pantau.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pantau*"]
